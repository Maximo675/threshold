# Integração contínua do Threshold: tudo roda a cada push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-e-api:
    name: Web e API (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0 # o Cypress só é baixado no job de e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências (falha em vulnerabilidade alta)
        run: npm audit --audit-level=high

  e2e:
    name: Ponta a ponta + acessibilidade (Cypress + axe)
    runs-on: ubuntu-latest
    needs: web-e-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - name: Guardar capturas em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots

  dados:
    name: Base ABNT e script de análise (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analise/requirements.txt
      - name: Validar a base ABNT da Lantern
        run: python3 -I data/abnt/validar_base.py
      - name: Testes do script de análise
        run: python3 -m pytest analise/tests -q
